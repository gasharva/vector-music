name: Patch ottava canonical projection

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/patch-ottava-builder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CanonicalNotationBuilder
        shell: python
        run: |
          from pathlib import Path

          path = Path("SemanticInterpreter/CanonicalNotationBuilder.cs")
          text = path.read_text(encoding="utf-8")

          old = '''        var tupletRelations = BuildTupletRelations(
              facts,
              noteheadToEventId,
              eventX);

          facts.AddTrace('''
          new = '''        var tupletRelations = BuildTupletRelations(
              facts,
              noteheadToEventId,
              eventX);
          var octaveShiftRelations = BuildOctaveShiftRelations(facts);

          facts.AddTrace('''
          assert old in text, "relation projection insertion point not found"
          text = text.replace(old, new, 1)

          old = '''            + $"slur-relations={slurRelations.Count}; tuplet-relations={tupletRelations.Count}; "
              + $"onsets={onsets.Length}; dotted-rests={restDots.Length}");'''
          new = '''            + $"slur-relations={slurRelations.Count}; tuplet-relations={tupletRelations.Count}; "
              + $"octave-shifts={octaveShiftRelations.Count}; "
              + $"onsets={onsets.Length}; dotted-rests={restDots.Length}");'''
          assert old in text, "trace insertion point not found"
          text = text.replace(old, new, 1)

          old = '''                [],
                  [],
                  [],
                  []));'''
          new = '''                [],
                  [],
                  [],
                  octaveShiftRelations));'''
          assert old in text, "Relations octave-shift slot not found"
          text = text.replace(old, new, 1)

          marker = '''    private static Accidental? ExplicitAccidental(PitchFact pitch)'''
          helper = '''    private static List<SpanRelation> BuildOctaveShiftRelations(
              SemanticFacts facts)
          {
              return facts
                  .OfType<OttavaFact>()
                  .OrderBy(fact => fact.StartMeasureNumber)
                  .ThenBy(fact => fact.StartX)
                  .ThenBy(fact => fact.BracketId, StringComparer.Ordinal)
                  .Select((fact, index) => new SpanRelation
                  {
                      Id = $"octaveShift-{index + 1}",
                      Kind = "octaveShift",
                      From = new TimeAnchor(
                          fact.StartMeasureNumber,
                          fact.StartAt,
                          fact.Staff),
                      To = new TimeAnchor(
                          fact.EndMeasureNumber,
                          fact.EndAt,
                          fact.Staff),
                      Direction = fact.Direction,
                      Size = fact.Size,
                      Placement = fact.Placement
                  })
                  .ToList();
          }

'''
          assert marker in text, "helper insertion point not found"
          text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit canonical projection
        run: |
          git config user.name "gasharva"
          git config user.email "gasharva@users.noreply.github.com"
          git add SemanticInterpreter/CanonicalNotationBuilder.cs
          git commit -m "Project ottava facts into canonical relations"
          git push origin HEAD:master
