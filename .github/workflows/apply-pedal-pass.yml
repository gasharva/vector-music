name: Apply pedal pass wiring

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-pedal-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply wiring patch
        run: python3 Tools/apply_pedal_pass.py

      - name: Commit wiring
        run: |
          git config user.name "gasharva"
          git config user.email "gasharva@users.noreply.github.com"
          git rm Tools/apply_pedal_pass.py .github/workflows/apply-pedal-pass.yml
          git add SemanticInterpreter/SemanticPipeline.cs SemanticInterpreter/CanonicalNotationBuilder.cs SemanticInterpreter/Program.cs CanonicalNotation/MusicXmlWriter.cs
          git commit -m "Wire pedal pass into canonical MusicXML"
          git push origin HEAD:master
