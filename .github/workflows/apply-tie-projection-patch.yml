name: Apply tie projection patch

on:
  push:
    branches:
      - semantic-canonical-poc
    paths:
      - ".github/workflows/apply-tie-projection-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply deterministic source patch
        run: python3 scripts/apply-tie-projection-patch.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SemanticInterpreter/CanonicalNotationBuilder.cs SemanticInterpreter/Program.cs
          git commit -m "Project TiePass into canonical relations"
          git push
