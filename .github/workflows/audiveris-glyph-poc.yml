name: Audiveris glyph PoC

on:
  push:
    branches:
      - audiveris-glyph-poc
    paths:
      - "AudiverisGlyphPoc/**"
      - "SvgScene/**"
      - ".github/workflows/audiveris-glyph-poc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-classify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct Kancheli fixture
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-input

          cat SvgScene/Fixtures/almonds-internet.svg.gz.b64.parts/part-* \
            | base64 --decode \
            | gzip --decompress \
            > ci-input/almonds-internet.svg

          echo "50ebc277329e20ca2cc1f7efc055eb7d9f04b8765cca34b5a90509e0f7fdd2fe  ci-input/almonds-internet.svg" \
            | sha256sum --check -

      - name: Build projects
        run: |
          dotnet build SvgScene/SvgScene.csproj --configuration Release
          dotnet build AudiverisGlyphPoc/AudiverisGlyphPoc.csproj --configuration Release

      - name: Export and classify SvgScene contours
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/glyphs

          dotnet run \
            --project SvgScene/SvgScene.csproj \
            --configuration Release \
            --no-build \
            -- \
            ci-input/almonds-internet.svg \
            artifacts/notation-scene.json \
            --classify-symbols \
            --export-glyphs artifacts/glyphs \
            | tee artifacts/export.log

      - name: Build multiscale classifier report
        shell: bash
        run: |
          set -euo pipefail

          dotnet run \
            --project AudiverisGlyphPoc/AudiverisGlyphPoc.csproj \
            --configuration Release \
            --no-build \
            -- \
            --glyph-dir artifacts/glyphs \
            | tee artifacts/classifier.log

      - name: Upload classification artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiveris-kanneli-glyphs
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable debug artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: debug-artifacts
          publish_dir: ./artifacts
          destination_dir: kancheli
          keep_files: false
          force_orphan: true
          commit_message: "Update Kancheli debug artifacts from ${{ github.sha }}"
