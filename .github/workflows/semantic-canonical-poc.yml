name: Semantic canonical PoC

on:
  push:
    branches:
      - semantic-canonical-poc
    paths:
      - "SemanticInterpreter/**"
      - "SemanticInterpreter.Tests/**"
      - "SvgScene/**"
      - "AudiverisGlyphPoc/**"
      - "CanonicalNotation/**"
      - "Samples/kancheli-almonds-mangled/**"
      - ".github/workflows/semantic-canonical-poc.yml"
  workflow_dispatch:

concurrency:
  group: semantic-canonical-poc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  interpret-kancheli:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run semantic unit tests
        run: dotnet test SemanticInterpreter.Tests/SemanticInterpreter.Tests.csproj --configuration Release

      - name: Build semantic interpreter
        run: dotnet build SemanticInterpreter/SemanticInterpreter.csproj --configuration Release

      - name: Interpret mangled Kancheli SVG and write MusicXML
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          dotnet run \
            --project SemanticInterpreter/SemanticInterpreter.csproj \
            --configuration Release \
            --no-build \
            -- \
            Samples/kancheli-almonds-mangled/kancheli-almonds-mangled.svg \
            artifacts \
            --title "When Almonds Blossomed - mangled" \
            --composer "Giya Kancheli" \
            | tee artifacts/semantic-run.log

      - name: Smoke-check raw MusicXML and MXL
        shell: bash
        run: |
          set -euo pipefail

          grep -q '<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 4.0 Partwise//EN"' \
            artifacts/kancheli.semantic.musicxml
          grep -q '<pitch>' artifacts/kancheli.semantic.musicxml
          grep -q '<type>' artifacts/kancheli.semantic.musicxml
          grep -q '<duration>' artifacts/kancheli.semantic.musicxml
          grep -q '^semantic.chords=' artifacts/semantic-summary.txt
          grep -q '^semantic.ties=' artifacts/semantic-summary.txt
          grep -q '^canonical.ties=' artifacts/semantic-summary.txt

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import xml.etree.ElementTree as ET

          musicxml_path = Path("artifacts/kancheli.semantic.musicxml")
          musicxml = musicxml_path.read_text(encoding="utf-8-sig")
          assert musicxml.count("<pitch>") > 0
          assert musicxml.count("<duration>") > 0
          assert musicxml.count("<type>") > 0

          root = ET.parse(musicxml_path).getroot()
          chord_continuations = sum(
              1 for note in root.iter("note") if note.find("chord") is not None
          )
          assert chord_continuations > 0, "ChordPass produced no MusicXML <chord/> continuations"

          tie_starts = sum(1 for tie in root.iter("tie") if tie.get("type") == "start")
          tie_stops = sum(1 for tie in root.iter("tie") if tie.get("type") == "stop")
          tied_starts = sum(1 for tied in root.iter("tied") if tied.get("type") == "start")
          tied_stops = sum(1 for tied in root.iter("tied") if tied.get("type") == "stop")
          assert tie_starts > 0, "TiePass produced no MusicXML <tie type='start'> markers"
          assert tie_starts == tie_stops == tied_starts == tied_stops, (
              tie_starts, tie_stops, tied_starts, tied_stops
          )

          for note in root.iter("note"):
              tie_types = [tie.get("type") for tie in note.findall("tie")]
              tied_types = [tied.get("type") for tied in note.findall("./notations/tied")]
              assert tie_types.count("start") <= 1, tie_types
              assert tie_types.count("stop") <= 1, tie_types
              assert tied_types.count("start") <= 1, tied_types
              assert tied_types.count("stop") <= 1, tied_types

          summary = Path("artifacts/semantic-summary.txt").read_text(encoding="utf-8")
          chord_line = next(
              line for line in summary.splitlines() if line.startswith("semantic.chords=")
          )
          tie_line = next(
              line for line in summary.splitlines() if line.startswith("semantic.ties=")
          )
          canonical_tie_line = next(
              line for line in summary.splitlines() if line.startswith("canonical.ties=")
          )
          assert int(chord_line.split("=", 1)[1]) > 0, chord_line
          tie_count = int(tie_line.split("=", 1)[1])
          canonical_tie_count = int(canonical_tie_line.split("=", 1)[1])
          assert tie_count > 0, tie_line
          assert canonical_tie_count == tie_count, (tie_line, canonical_tie_line)
          assert tie_starts == canonical_tie_count, (tie_starts, canonical_tie_count)

          # Visual regression: m11 lower chord has three tied pitches into m12.
          m11 = next(measure for measure in root.iter("measure") if measure.get("number") == "11")
          m11_lower_ties = [
              note for note in m11.findall("note")
              if note.findtext("staff") == "2"
              and any(tie.get("type") == "start" for tie in note.findall("tie"))
          ]
          assert len(m11_lower_ties) == 3, len(m11_lower_ties)

          # Visual regression: both notes of the lower-staff chord in m13 are dotted.
          m13 = next(measure for measure in root.iter("measure") if measure.get("number") == "13")
          m13_lower = [note for note in m13.findall("note") if note.findtext("staff") == "2"]
          assert len(m13_lower) == 2, len(m13_lower)
          assert all(len(note.findall("dot")) == 1 for note in m13_lower), [
              len(note.findall("dot")) for note in m13_lower
          ]

          # Visual regression: m16 is two voices, not three. Voice 1 is
          # Ab5 half -> eighth rest -> Ab5 eighth; voice 2 enters at 1/2 with F5/G5.
          canonical = json.loads(
              Path("artifacts/kancheli.semantic.canonical.json").read_text(encoding="utf-8-sig")
          )
          m16_events = next(
              measure["events"]
              for measure in canonical["parts"][0]["measures"]
              if measure["number"] == 16
          )

          def pitched_event(pitch, duration):
              return next(
                  event for event in m16_events
                  if event.get("duration") == duration
                  and any(note.get("pitch") == pitch for note in event.get("notes") or [])
              )

          lead = pitched_event("Ab5", "1/2")
          returned = pitched_event("Ab5", "1/8")
          rest = next(
              event for event in m16_events
              if event.get("type") == "rest" and event.get("staff") == 1
          )
          parallel = next(
              event for event in m16_events
              if event.get("duration") == "1/4"
              and {note.get("pitch") for note in event.get("notes") or []} == {"F5", "G5"}
          )
          assert (lead["voice"], lead["at"]) == (1, "0"), lead
          assert (rest["voice"], rest["at"]) == (1, "1/2"), rest
          assert (returned["voice"], returned["at"]) == (1, "5/8"), returned
          assert (parallel["voice"], parallel["at"]) == (2, "1/2"), parallel

          mxl = Path("artifacts/kancheli.semantic.mxl")
          with ZipFile(mxl) as archive:
              names = archive.namelist()
              assert names[0] == "mimetype", names
              assert "META-INF/container.xml" in names, names
              assert "score.musicxml" in names, names

              score = archive.read("score.musicxml").decode("utf-8-sig")
              assert "<!DOCTYPE score-partwise PUBLIC" in score
              assert "<pitch>" in score
              assert "<duration>" in score
              assert "<type>" in score
              assert "<chord" in score
              assert "<tie " in score
              assert "<tied " in score
          PY

      - name: Upload semantic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-kancheli-mangled-musicxml
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable semantic artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: semantic-artifacts
          publish_dir: ./artifacts
          destination_dir: kancheli-mangled
          keep_files: true
          commit_message: "Update semantic mangled Kancheli artifacts from ${{ github.sha }}"
