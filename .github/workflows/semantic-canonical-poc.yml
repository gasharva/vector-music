name: Semantic canonical PoC

on:
  push:
    branches:
      - semantic-canonical-poc
    paths:
      - "SemanticInterpreter/**"
      - "SvgScene/**"
      - "AudiverisGlyphPoc/**"
      - "CanonicalNotation/**"
      - ".github/workflows/semantic-canonical-poc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  interpret-kancheli:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct internet Kancheli fixture
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-input

          cat SvgScene/Fixtures/almonds-internet.svg.gz.b64.parts/part-* \
            | base64 --decode \
            | gzip --decompress \
            > ci-input/almonds-internet.svg

          echo "50ebc277329e20ca2cc1f7efc055eb7d9f04b8765cca34b5a90509e0f7fdd2fe  ci-input/almonds-internet.svg" \
            | sha256sum --check -

      - name: Build semantic interpreter
        run: dotnet build SemanticInterpreter/SemanticInterpreter.csproj --configuration Release

      - name: Interpret SVG and write MusicXML
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          dotnet run \
            --project SemanticInterpreter/SemanticInterpreter.csproj \
            --configuration Release \
            --no-build \
            -- \
            ci-input/almonds-internet.svg \
            artifacts \
            --title "When Almonds Blossomed" \
            --composer "Giya Kancheli" \
            | tee artifacts/semantic-run.log

      - name: Upload semantic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-kancheli-musicxml
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable semantic artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: semantic-artifacts
          publish_dir: ./artifacts
          destination_dir: kancheli
          keep_files: false
          force_orphan: true
          commit_message: "Update semantic Kancheli artifacts from ${{ github.sha }}"
