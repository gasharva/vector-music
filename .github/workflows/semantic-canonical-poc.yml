name: Semantic interpreter

on:
  push:
    branches:
      - master
    paths:
      - "SemanticInterpreter/**"
      - "SemanticInterpreter.Tests/**"
      - "SvgScene/**"
      - "AudiverisGlyphPoc/**"
      - "CanonicalNotation/**"
      - "Samples/kancheli-mimino/**"
      - "Samples/cairo-yellow-leaves/**"
      - "Tools/**"
      - ".github/workflows/semantic-canonical-poc.yml"
  workflow_dispatch:

concurrency:
  group: semantic-master
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  interpret-kancheli:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run semantic unit tests
        run: dotnet test SemanticInterpreter.Tests/SemanticInterpreter.Tests.csproj --configuration Release

      - name: Build semantic interpreter and OCR diagnostics
        run: |
          dotnet build SemanticInterpreter/SemanticInterpreter.csproj --configuration Release
          dotnet build Tools/TextOcrDiagnostics/TextOcrDiagnostics.csproj --configuration Release
          dotnet build Tools/SvgScoreBatch/SvgScoreBatch.csproj --configuration Release

      - name: Probe Cairo Yellow Leaves layout
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/cairo-layout

          for variant in cairo optimized; do
            for page in 001 002; do
              echo
              echo "=== $variant page-$page ==="
              mkdir -p "artifacts/cairo-layout/$variant-$page"

              dotnet SemanticInterpreter/bin/Release/net8.0/SemanticInterpreter.dll                 "Samples/cairo-yellow-leaves/$variant/page-$page.svg"                 "artifacts/cairo-layout/$variant-$page"                 --layout-only                 > "artifacts/cairo-layout/$variant-$page/run.log" 2>&1

              status=$?
              echo "exit=$status"
              cat "artifacts/cairo-layout/$variant-$page/run.log"
            done
          done

          exit 0

      - name: Upload Cairo layout diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: cairo-yellow-leaves-layout
          path: artifacts/cairo-layout/
          if-no-files-found: error
          retention-days: 30

      - name: Run full optimized Cairo score batch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/cairo-optimized-full
          mkdir -p artifacts/cairo-optimized-full

          dotnet Tools/SvgScoreBatch/bin/Release/net8.0/SvgScoreBatch.dll             Samples/cairo-yellow-leaves/optimized             artifacts/cairo-optimized-full             --base page             --reference Samples/kancheli-mimino/kancheli-mimino.musicxml             --configuration Release             --no-build             --diff-level error             | tee artifacts/cairo-optimized-full/batch.log

      - name: Upload full optimized Cairo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairo-yellow-leaves-optimized-full
          path: artifacts/cairo-optimized-full/
          if-no-files-found: warn
          retention-days: 30

      - name: Interpret Kancheli Mimino SVG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          dotnet run \
            --project SemanticInterpreter/SemanticInterpreter.csproj \
            --configuration Release \
            --no-build \
            -- \
            Samples/kancheli-mimino/kancheli-mimino.svg \
            artifacts \
            | tee artifacts/semantic-run.log

      - name: Generate OCR text diagnostics
        shell: bash
        run: |
          set -euo pipefail

          dotnet run \
            --project Tools/TextOcrDiagnostics/TextOcrDiagnostics.csproj \
            --configuration Release \
            --no-build \
            -- \
            Samples/kancheli-mimino/kancheli-mimino.svg \
            artifacts \
            | tee artifacts/ocr-run.log

          test -f artifacts/parser.ocr.json
          test -f artifacts/parser.ocr.svg
          test -f artifacts/parser.ocr.runs.svg
          grep -q 'Raw glyphs OCR-probed' artifacts/ocr-run.log
          grep -q 'Horizontal runs' artifacts/ocr-run.log

      - name: Export unique SvgScene prototype SVGs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/glyphs-svg

          dotnet run \
            --project SvgScene/SvgScene.csproj \
            --configuration Release \
            -- \
            Samples/kancheli-mimino/kancheli-mimino.svg \
            artifacts/glyph-scene.json \
            --classify-symbols \
            --export-glyphs-svg artifacts/glyphs-svg \
            | tee artifacts/glyph-svg-export.log

          test -f artifacts/glyphs-svg/manifest.json
          test -f artifacts/glyphs-svg/index.html

          glyph_count="$(find artifacts/glyphs-svg -maxdepth 1 -type f -name '*.svg' | wc -l)"
          echo "Unique SVG glyph prototypes: $glyph_count"
          test "$glyph_count" -gt 0

          (
            cd artifacts
            zip -qr glyphs-svg.zip glyphs-svg
          )
          test -s artifacts/glyphs-svg.zip

      - name: Generate vertical zigzag diagnostics
        shell: bash
        run: |
          set -euo pipefail

          dotnet run \
            --project Tools/ZigZagDiagnostics/ZigZagDiagnostics.csproj \
            --configuration Release \
            -- \
            Samples/kancheli-mimino/kancheli-mimino.svg \
            artifacts/zigzag-scene.json \
            | tee artifacts/zigzag-parser.log

          python3 Tools/publish_zigzag_diagnostics.py \
            artifacts/zigzag-scene.json \
            artifacts/source.svg \
            artifacts

          grep '^parser.verticalZigZags=' artifacts/semantic-summary.txt
          test -f artifacts/parser.zigzags.svg

      - name: Smoke-check essential output
        shell: bash
        run: |
          set -euo pipefail

          grep -q '<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 4.0 Partwise//EN"' \
            artifacts/kancheli.semantic.musicxml
          grep -q '<pitch>' artifacts/kancheli.semantic.musicxml
          grep -q '<duration>' artifacts/kancheli.semantic.musicxml
          grep -q '^semantic.noteheads=' artifacts/semantic-summary.txt
          grep -q '^semantic.graceNotes=2$' artifacts/semantic-summary.txt
          grep -q '^canonical.graceEvents=2$' artifacts/semantic-summary.txt
          grep -q '^semantic.chords=' artifacts/semantic-summary.txt
          grep -q '^semantic.ties=3$' artifacts/semantic-summary.txt
          grep -q '^semantic.slurs=12$' artifacts/semantic-summary.txt
          grep -q '^semantic.pedals=4$' artifacts/semantic-summary.txt
          grep -q '^canonical.pedals=4$' artifacts/semantic-summary.txt
          grep -q '^parser.verticalZigZags=' artifacts/semantic-summary.txt
          test -f artifacts/parser.ocr.runs.svg
          test -f artifacts/semantic.text.svg
          grep -q '^semantic.text=' artifacts/semantic-summary.txt

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import xml.etree.ElementTree as ET

          xml_path = Path("artifacts/kancheli.semantic.musicxml")
          root = ET.parse(xml_path).getroot()
          assert root.tag == "score-partwise"
          assert sum(1 for _ in root.iter("note")) > 0

          def grace_signature(doc_root):
              result = []
              for part in doc_root.findall("part"):
                  for measure in part.findall("measure"):
                      for note in measure.findall("note"):
                          if note.find("grace") is None:
                              continue
                          pitch = note.find("pitch")
                          result.append((
                              part.get("id"),
                              measure.get("number"),
                              pitch.findtext("step"),
                              int(pitch.findtext("alter") or 0),
                              int(pitch.findtext("octave")),
                              note.findtext("type")))
              return result

          def dynamic_signature(doc_root):
              result = []
              for part in doc_root.findall("part"):
                  for measure in part.findall("measure"):
                      for direction in measure.findall("direction"):
                          dynamics = direction.find("direction-type/dynamics")
                          if dynamics is None or len(dynamics) == 0:
                              continue
                          result.append((
                              int(measure.get("number")),
                              dynamics[0].tag))
              return result

          source_root = ET.parse(
              "Samples/kancheli-mimino/kancheli-mimino.musicxml").getroot()
          source_grace = grace_signature(source_root)
          generated_grace = grace_signature(root)
          assert source_grace == [
              ("P1", "15", "C", 0, 5, "16th"),
              ("P1", "15", "B", -1, 4, "16th")
          ]
          assert generated_grace == source_grace

          source_dynamics = dynamic_signature(source_root)
          generated_dynamics = dynamic_signature(root)
          assert source_dynamics == [
              (4, "mp"),
              (5, "pp"),
              (12, "mp"),
              (13, "pp")
          ]
          assert generated_dynamics == source_dynamics, (
              source_dynamics,
              generated_dynamics)

          canonical = json.loads(Path(
              "artifacts/kancheli.semantic.canonical.json").read_text())
          grace_events = [
              event
              for part in canonical["parts"]
              for measure in part["measures"]
              for event in measure["events"]
              if event.get("grace") is True
          ]
          assert len(grace_events) == 2
          assert {event["at"] for event in grace_events} == {"1/4"}
          assert all("duration" not in event for event in grace_events)

          pedals = canonical["relations"]["pedals"]
          assert len(pedals) == 4
          assert [pedal["from"]["measure"] for pedal in pedals] == [4, 8, 12, 16]
          assert all(pedal["from"]["staff"] == 2 for pedal in pedals)
          assert all(pedal["to"]["staff"] == 2 for pedal in pedals)
          assert all(pedal["from"]["at"] == "0" for pedal in pedals)
          assert all(pedal["to"]["at"] == "3/4" for pedal in pedals)

          def measure(number):
              return next(
                  item
                  for item in canonical["parts"][0]["measures"]
                  if item["number"] == number)

          def event_with_pitch(number, pitch):
              return next(
                  event
                  for event in measure(number)["events"]
                  if any(note.get("pitch") == pitch for note in event.get("notes", [])))

          for number in (4, 12):
              upper = event_with_pitch(number, "F4")
              lower = event_with_pitch(number, "E4")
              assert (upper["voice"], upper["at"]) == (1, "0")
              assert (lower["voice"], lower["at"]) == (2, "0")

          m20 = measure(20)
          lower_rest = next(event for event in m20["events"] if event["type"] == "rest")
          assert (lower_rest["staff"], lower_rest["at"]) == (2, "0")
          upper_sustained = [
              event
              for event in m20["events"]
              if event.get("notes")
              and any(note.get("staff") == 1 for note in event["notes"])
          ]
          assert len(upper_sustained) == 2
          assert all(event["at"] == "0" for event in upper_sustained)

          with ZipFile("artifacts/kancheli.semantic.mxl") as archive:
              names = set(archive.namelist())
              assert "META-INF/container.xml" in names
              assert "score.musicxml" in names
          PY

      - name: Prepare curated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish

          files=(
            README.md
            index.html
            source.svg
            source.musicxml
            kancheli.semantic.canonical.json
            kancheli.semantic.musicxml
            kancheli.semantic.mxl
            semantic-summary.txt
            semantic-run.log
            parser.classified-symbols.svg
            parser.ownership.svg
            parser.zigzags.svg
            parser.ocr.svg
            parser.ocr.runs.svg
            parser.ocr.json
            ocr-run.log
            semantic.noteheads.svg
            semantic.accidentals.svg
            semantic.stems.svg
            semantic.beams.svg
            semantic.dots.svg
            semantic.text.svg
            semantic.noteheads.txt
            zigzag-scene.json
            glyph-svg-export.log
            glyphs-svg.zip
          )

          for file in "${files[@]}"; do
            if [ -f "artifacts/$file" ]; then
              cp "artifacts/$file" "publish/$file"
            fi
          done

          cp -R artifacts/glyphs-svg publish/glyphs-svg

          python3 - <<'PY'
          from pathlib import Path
          path = Path("publish/index.html")
          if path.exists():
              html = path.read_text()
              links = (
                  '<p><strong>OCR diagnostics:</strong> '
                  '<a href="parser.ocr.runs.svg">recognized text runs</a> · '
                  '<a href="parser.ocr.svg">all OCR boxes</a> · '
                  '<a href="parser.ocr.json">JSON</a></p>'
                  '<p><strong>SvgScene vector glyphs:</strong> '
                  '<a href="glyphs-svg/index.html">browse prototypes</a> · '
                  '<a href="glyphs-svg.zip">download ZIP</a></p>'
              )
              if "parser.ocr.runs.svg" not in html:
                  html = html.replace("</body>", links + "\n</body>")
                  path.write_text(html)
          PY

          echo "Published top-level artifact count: $(find publish -maxdepth 1 -type f | wc -l)"
          echo "Published SVG glyph count: $(find publish/glyphs-svg -maxdepth 1 -type f -name '*.svg' | wc -l)"
          find publish -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload curated semantic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-kancheli-mimino
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable semantic artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: semantic-artifacts
          publish_dir: ./publish
          destination_dir: kancheli-mimino
          keep_files: false
          commit_message: "Update Mimino semantic artifacts from ${{ github.sha }}"
