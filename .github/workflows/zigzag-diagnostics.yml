name: Zigzag diagnostics

on:
  push:
    branches:
      - semantic-canonical-poc
    paths:
      - "SvgScene/**"
      - "Tools/publish_zigzag_diagnostics.py"
      - ".github/workflows/zigzag-diagnostics.yml"
  workflow_dispatch:

concurrency:
  group: zigzag-diagnostics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-zigzags:
    runs-on: ubuntu-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build SvgScene
        run: dotnet build SvgScene/SvgScene.csproj --configuration Release

      - name: Prepare existing published artifact index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          git clone \
            --depth=1 \
            --single-branch \
            --branch semantic-artifacts \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            published

          if [ -d published/kancheli-mangled ]; then
            for f in semantic-summary.txt index.html README.md; do
              if [ -f "published/kancheli-mangled/$f" ]; then
                cp "published/kancheli-mangled/$f" "artifacts/$f"
              fi
            done
          fi

          cp Samples/kancheli-almonds-mangled/kancheli-almonds-mangled.svg artifacts/source.svg

      - name: Generate vertical zigzag diagnostics
        shell: bash
        run: |
          set -euo pipefail

          dotnet run \
            --project SvgScene/SvgScene.csproj \
            --configuration Release \
            --no-build \
            -- \
            Samples/kancheli-almonds-mangled/kancheli-almonds-mangled.svg \
            artifacts/zigzag-scene.json \
            > artifacts/zigzag-parser.log

          python3 Tools/publish_zigzag_diagnostics.py \
            artifacts/zigzag-scene.json \
            artifacts/source.svg \
            artifacts

          grep '^parser.verticalZigZags=' artifacts/semantic-summary.txt
          test -f artifacts/parser.zigzags.svg

      - name: Upload zigzag diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: zigzag-diagnostics
          path: |
            artifacts/parser.zigzags.svg
            artifacts/zigzag-scene.json
            artifacts/zigzag-parser.log
            artifacts/semantic-summary.txt
            artifacts/index.html
            artifacts/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish zigzag diagnostics into stable semantic artifacts
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: semantic-artifacts
          publish_dir: ./artifacts
          destination_dir: kancheli-mangled
          keep_files: true
          commit_message: "Update zigzag diagnostics from ${{ github.sha }}"
