name: Apply pedal start anchor fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-pedal-start-anchor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        run: python3 Tools/fix_pedal_start_anchor.py

      - name: Commit fix
        run: |
          git config user.name "gasharva"
          git config user.email "gasharva@users.noreply.github.com"
          git rm Tools/fix_pedal_start_anchor.py .github/workflows/fix-pedal-start-anchor.yml
          git add SemanticInterpreter/PedalPass.cs
          git commit -m "Anchor pedal onset to pedal mark"
          git push origin HEAD:master
