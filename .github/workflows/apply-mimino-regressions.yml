name: Apply Mimino regression fixes

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-mimino-regressions.yml"
      - ".github/mimino-fixes/apply.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Apply regression patch
        run: python3 .github/mimino-fixes/apply.py

      - name: Run semantic unit tests
        run: dotnet test SemanticInterpreter.Tests/SemanticInterpreter.Tests.csproj --configuration Release

      - name: Build semantic interpreter
        run: dotnet build SemanticInterpreter/SemanticInterpreter.csproj --configuration Release

      - name: Commit verified code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gasharva"
          git config user.email "gasharva@users.noreply.github.com"
          git add \
            SemanticInterpreter/VoicePass.cs \
            SemanticInterpreter/SlurPass.cs \
            SvgScene/LogicalOwnership.cs \
            SemanticInterpreter.Tests/VoicePassTests.cs \
            SemanticInterpreter.Tests/SlurPassTests.cs \
            SemanticInterpreter.Tests/LogicalOwnershipPrimitiveTests.cs
          git commit -m "Fix Mimino voice slur and rest ownership regressions [skip ci]"
          git push origin HEAD:master
