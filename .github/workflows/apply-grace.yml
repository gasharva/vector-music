name: Apply grace-note implementation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-grace.yml"
      - ".github/grace/apply_grace.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Apply grace-note patch
        run: python3 .github/grace/apply_grace.py

      - name: Run semantic unit tests
        run: dotnet test SemanticInterpreter.Tests/SemanticInterpreter.Tests.csproj --configuration Release

      - name: Build semantic interpreter
        run: dotnet build SemanticInterpreter/SemanticInterpreter.csproj --configuration Release

      - name: Commit permanent grace-note implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gasharva"
          git config user.email "gasharva@users.noreply.github.com"
          git rm .github/grace/apply_grace.py .github/workflows/apply-grace.yml
          git add \
            SemanticInterpreter/GraceNotePass.cs \
            SemanticInterpreter/SemanticPipeline.cs \
            SemanticInterpreter/DurationPass.cs \
            SemanticInterpreter/CanonicalNotationBuilder.cs \
            SemanticInterpreter/Program.cs \
            CanonicalNotation/CanonicalNotation.cs \
            CanonicalNotation/MusicXmlWriter.cs \
            CanonicalNotation/MusicXmlCanonicalizer.cs \
            SemanticInterpreter.Tests/GraceNotePassTests.cs \
            .github/workflows/semantic-canonical-poc.yml
          git commit -m "Recognize reduced grace-note cluster"
          git push origin HEAD:master
