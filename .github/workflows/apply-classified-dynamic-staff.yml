name: Apply classified dynamic staff rule

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-classified-dynamic-staff.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Apply nearest-staff rule
        run: python3 Tools/apply_classified_dynamic_staff.py

      - name: Run semantic unit tests
        run: dotnet test SemanticInterpreter.Tests/SemanticInterpreter.Tests.csproj --configuration Release

      - name: Commit permanent dynamic staff rule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gasharva"
          git config user.email "gasharva@users.noreply.github.com"
          git rm Tools/apply_classified_dynamic_staff.py .github/workflows/apply-classified-dynamic-staff.yml
          git add SemanticInterpreter/ClassifiedSymbolPass.cs
          git commit -m "Resolve classified dynamics to nearest staff"
          git push origin HEAD:master
