name: Apply score regression fixes

on:
  push:
    branches:
      - semantic-canonical-poc
    paths:
      - ".github/workflows/apply-score-regression-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply prepared score fixes
        run: python3 scripts/apply-score-regression-fixes.py

      - name: Recover ordinary residual beam boxes and add golden checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "SemanticInterpreter/ResidualBeamHookRecovery.cs",
              "private const double MaximumLengthInSpacings = 1.55;",
              "private const double MaximumLengthInSpacings = 4.50;")
          replace_once(
              "SemanticInterpreter/ResidualBeamHookRecovery.cs",
              "Beam hooks are much shorter than ordinary beams. Their filled rectangular\n/// contour can therefore fail the generic stroke extractor's elongation test\n/// and survive as a residual ShapeElement. Recover only the compact horizontal\n/// box geometry that has beam-like dimensions; BeamAttachmentAnalyzer still",
              "Filled beam rectangles can fail the generic stroke extractor and survive as\n/// residual ShapeElements. This happens both for compact hooks and for ordinary\n/// two-note beams. Recover horizontal beam-like boxes across that full useful length\n/// range; BeamAttachmentAnalyzer still")
          replace_once(
              "SemanticInterpreter/BeamAttachmentPass.cs",
              "$\"recovered-compact-hooks={recovery.RecoveredCount}; \"",
              "$\"recovered-residual-beams={recovery.RecoveredCount}; \"")

          test = Path("SemanticInterpreter.Tests/BeamAttachmentPassTests.cs")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              'line => line.Contains("recovered-compact-hooks=1", StringComparison.Ordinal));',
              'line => line.Contains("recovered-residual-beams=1", StringComparison.Ordinal));')
          text = text.replace(
              "public void ResidualBoxOutsideHookLengthBand_IsNotRecovered()",
              "public void OrdinaryLengthResidualBeamBox_IsRecoveredForDownstreamValidation()")
          text = text.replace(
              "Assert.Equal(0, recovery.RecoveredCount);\n        Assert.Single(recovery.Document.Measures[0].Upper.Elements);",
              "Assert.Equal(1, recovery.RecoveredCount);\n        Assert.Equal(2, recovery.Document.Measures[0].Upper.Elements.Count);\n        Assert.Contains(recovery.Document.Measures[0].Upper.Elements, element =>\n            element is StrokeElement stroke && stroke.ShapeId == \"long-box\");")
          test.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/semantic-canonical-poc.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              "          assert canonical_tie_count == tie_count, (tie_line, canonical_tie_line)\n          assert tie_starts == canonical_tie_count, (tie_starts, canonical_tie_count)\n",
              "          assert canonical_tie_count == tie_count, (tie_line, canonical_tie_line)\n          assert tie_starts == canonical_tie_count, (tie_starts, canonical_tie_count)\n          assert tie_count == 29, tie_line\n",
              1)
          anchor = '''          assert (parallel["voice"], parallel["at"]) == (2, "1/2"), parallel\n\n          mxl = Path("artifacts/kancheli.semantic.mxl")\n'''
          insert = '''          assert (parallel["voice"], parallel["at"]) == (2, "1/2"), parallel\n\n          # Measures 21 and 22 each contain three beamed eighth-note pairs upstairs.\n          for measure_no in ("21", "22"):\n              measure = next(m for m in root.iter("measure") if m.get("number") == measure_no)\n              upper = [note for note in measure.findall("note") if note.findtext("staff") == "1"]\n              assert len(upper) == 6, (measure_no, len(upper))\n              assert all(note.findtext("type") == "eighth" for note in upper), measure_no\n              begins = sum(1 for note in upper for beam in note.findall("beam") if beam.text == "begin")\n              ends = sum(1 for note in upper for beam in note.findall("beam") if beam.text == "end")\n              assert (begins, ends) == (3, 3), (measure_no, begins, ends)\n\n          mxl = Path("artifacts/kancheli.semantic.mxl")\n'''
          if anchor not in text:
              raise SystemExit("m16 workflow anchor not found")
          workflow.write_text(text.replace(anchor, insert, 1), encoding="utf-8")
          PY

      - name: Run unit tests before commit
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test SemanticInterpreter.Tests/SemanticInterpreter.Tests.csproj --configuration Release

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SemanticInterpreter SemanticInterpreter.Tests .github/workflows/semantic-canonical-poc.yml
          git commit -m "Fix score regressions in ties rhythm voices and beams"
          git push
